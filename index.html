<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DLKZ77CC EDITZ</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #05070f;
  color: white;
  overflow-x: hidden;
  position: relative;
}

/* ===== LOADING ===== */
#loading {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #000 0%, #02040a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.loading-box {
  padding: 30px 40px;
  border-radius: 18px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  text-align: center;
  animation: pop 0.8s ease;
}

@keyframes pop {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.title {
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  color: #00aaff;
  letter-spacing: 2px;
}

#percent {
  font-size: 22px;
  color: #00aaff;
  margin-top: 5px;
}

#bar {
  width: 220px;
  height: 6px;
  background: #111;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 10px;
}

#progress {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #00aaff, #0066ff);
}

/* ===== GOJO FUNDO ===== */
.gojo-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: url("https://images5.alphacoders.com/131/1314707.jpeg") center/cover no-repeat;
  filter: blur(1px) brightness(0.5);
  opacity: 0.22;
  transform: scale(1.05);
}

/* CONTEÚDO */
header, section, footer {
  position: relative;
  z-index: 2;
}

/* ESTRELAS */
.stars {
  position: fixed;
  inset: 0;
  z-index: 1;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #4aaaff;
  border-radius: 50%;
  animation: float linear infinite;
  box-shadow: 0 0 6px #4aaaff;
}

@keyframes float {
  from { transform: translateY(0); }
  to { transform: translateY(-120vh); }
}

/* HEADER */
header {
  text-align: center;
  padding: 40px 20px;
}

.glow {
  font-size: 38px;
  color: #00aaff;
  text-shadow: 0 0 10px #00aaff, 0 0 20px #0066ff;
}

/* FADE */
.fade {
  opacity: 0;
  transform: translateY(30px);
  transition: 1s ease;
}

.fade.show {
  opacity: 1;
  transform: translateY(0);
}

/* SEÇÕES */
section {
  max-width: 800px;
  margin: 40px auto;
  padding: 20px;
}

/* TABELA */
.table {
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 15px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.row:last-child { border-bottom: none; }

.row span { color: #ccc; }
.row b { color: #00aaff; }

/* FORM */
select, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #111;
  color: white;
}

textarea { height: 100px; }

/* BOTÃO AZUL */
button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  background: #00aaff;
  border: none;
  border-radius: 10px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #0088ff;
  transform: scale(1.02);
}

/* FOOTER */
footer {
  text-align: center;
  padding: 30px;
  color: #666;
}

</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
  <div class="loading-box">
    <div class="title">BEM VINDO AO SITE</div>
    <div id="percent">0%</div>
    <div id="bar"><div id="progress"></div></div>
  </div>
</div>

<!-- GOJO -->
<div class="gojo-bg"></div>

<!-- ESTRELAS -->
<div class="stars" id="stars"></div>

<!-- CONTEÚDO -->
<header class="fade">
  <h1 class="glow">DLKZ77CC EDITZ</h1>
  <p>Motion | Anime | Futebol | Foto | Games</p>
</header>

<section class="fade">
  <h2>Preços</h2>

  <div class="table">
    <div class="row"><span>Edição de Fotos</span><b>R$ 7,00</b></div>
    <div class="row"><span>Edit de Futebol</span><b>R$ 12,00</b></div>
    <div class="row"><span>Edit de Anime</span><b>R$ 15,00</b></div>
    <div class="row"><span>Roblox</span><b>R$ 19,00</b></div>
    <div class="row"><span>Free Fire</span><b>R$ 27,00</b></div>
    <div class="row"><span>Motion Design</span><b>R$ 30,00</b></div>
  </div>
</section>

<section class="fade">
  <h2>O que você quer na edição?</h2>

  <select>
    <option>Anime</option>
    <option>Futebol</option>
    <option>Motion</option>
    <option>Free Fire</option>
    <option>Roblox</option>
  </select>

  <textarea placeholder="Descreva sua ideia..."></textarea>

  <button onclick="zap()">FALAR COM O EDITOR NO WHATSAPP</button>
</section>

<footer>
  <p>© DLKZ77CC EDITZ</p>
</footer>

<script>

/* LOADING */
let p = 0;

let load = setInterval(() => {
  p++;

  document.getElementById("progress").style.width = p + "%";
  document.getElementById("percent").innerText = p + "%";

  if (p >= 100) {
    clearInterval(load);

    document.getElementById("loading").style.opacity = "0";

    setTimeout(() => {
      document.getElementById("loading").style.display = "none";

      document.querySelectorAll(".fade").forEach((el,i)=>{
        setTimeout(()=> el.classList.add("show"), i*200);
      });

    }, 600);
  }

}, 20);

/* ESTRELAS */
const stars = document.getElementById("stars");

for (let i = 0; i < 120; i++) {
  let s = document.createElement("div");
  s.className = "star";

  s.style.left = Math.random()*100 + "%";
  s.style.top = Math.random()*100 + "%";
  s.style.animationDuration = (Math.random()*5+3)+"s";

  stars.appendChild(s);
}

/* WHATSAPP */
function zap() {
  let tipo = document.querySelector("select").value;
  let msg = document.querySelector("textarea").value;

  let url = "https://wa.me/5511951319587?text=" +
  encodeURIComponent("Quero uma edição de: " + tipo + " | Detalhes: " + msg);

  window.open(url);
}

</script>

</body>
</html>
