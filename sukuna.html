<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUKUNA TERRITÓRIO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
scroll-behavior:smooth;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* FUNDO */

.sukuna-page{
min-height:100vh;
background:linear-gradient(to bottom,#000,#2b0000,#000);
position:relative;
overflow:hidden;
padding:50px 20px;
}

/* PARTÍCULAS */

.particles{
position:absolute;
width:100%;
height:100%;
top:0;
left:0;
overflow:hidden;
}

.particle{
position:absolute;
width:5px;
height:5px;
background:#ff3333;
border-radius:50%;
box-shadow:0 0 20px red;
animation:float 3s infinite alternate;
}

@keyframes float{
from{
transform:translateY(0px);
opacity:.3;
}

to{
transform:translateY(-20px);
opacity:1;
}
}

/* INTRO */

.intro{
text-align:center;
position:relative;
z-index:2;
}

.title{
font-size:65px;
color:#ff3333;
text-shadow:0 0 30px red;
margin-top:80px;
animation:show 2s forwards;
opacity:0;
}

@keyframes show{
from{
opacity:0;
transform:translateY(-100px);
}

to{
opacity:1;
transform:translateY(0);
}
}

.subtitle{
font-size:28px;
margin-top:20px;
color:#ff9999;
opacity:0;
animation:fade 2s forwards;
animation-delay:1s;
}

@keyframes fade{
to{
opacity:1;
}
}

.sukuna-img{
width:350px;
margin-top:30px;
filter:drop-shadow(0 0 40px red);
animation:fade2 2s forwards;
animation-delay:1.5s;
opacity:0;
}

@keyframes fade2{
from{
opacity:0;
transform:translateY(50px);
}

to{
opacity:1;
transform:translateY(0);
}
}

/* BOX */

.box{
max-width:900px;
margin:auto;
margin-top:50px;
background:rgba(255,255,255,.05);
border:1px solid #ff3333;
border-radius:30px;
padding:35px;
backdrop-filter:blur(10px);
box-shadow:0 0 40px rgba(255,0,0,.4);
position:relative;
z-index:2;
}

.text{
font-size:24px;
line-height:1.8;
margin-top:20px;
color:#ffb3b3;
}

/* INPUTS */

select,
textarea{
width:100%;
padding:20px;
margin-top:20px;
background:rgba(255,255,255,.08);
border:none;
border-radius:20px;
font-size:18px;
color:white;
outline:none;
}

textarea{
height:180px;
resize:none;
}

/* BOTÃO */

.zap-btn{
display:inline-block;
margin-top:35px;
padding:20px 50px;
background:#25D366;
color:white;
text-decoration:none;
font-size:24px;
font-weight:bold;
border-radius:50px;
box-shadow:0 0 30px #25D366;
transition:.3s;
}

.zap-btn:hover{
transform:scale(1.07);
}

/* SOCIAL */

.social{
margin-top:20px;
font-size:22px;
color:#ff9999;
}

/* ESTRELAS */

.rating{
font-size:55px;
margin-top:40px;
cursor:pointer;
}

.star:hover{
transform:scale(1.2);
}

</style>
</head>

<body>

<section class="sukuna-page">

<!-- PARTÍCULAS -->

<div class="particles">
<div class="particle" style="top:10%;left:20%;"></div>
<div class="particle" style="top:30%;left:70%;"></div>
<div class="particle" style="top:60%;left:10%;"></div>
<div class="particle" style="top:80%;left:40%;"></div>
<div class="particle" style="top:20%;left:50%;"></div>
<div class="particle" style="top:70%;left:80%;"></div>
</div>

<!-- INTRO -->

<div class="intro">

<h1 class="title">
Bem-vindo ao meu território
</h1>

<p class="subtitle">
“Aqui você entra… e não sai mais.”
</p>

<img
class="sukuna-img"
src="https://i.imgur.com/5kV8mXx.png"
alt="Sukuna"
>

</div>

<!-- BOX -->

<div class="box">

<h2 style="font-size:45px;color:#ff3333;">
Faça seu pedido
</h2>

<p class="text">
“Patético seria entregar algo comum.”
</p>

<p class="text">
“Aqui tudo nasce acima do nível.”
</p>

<!-- EDIT -->

<select id="edit">
<option>Escolha sua edit</option>
<option>Motion - R$27</option>
<option>Futebol - R$15</option>
<option>Anime - R$13</option>
</select>

<!-- PAGAMENTO -->

<select id="pay">
<option>Forma de pagamento</option>
<option>Pix</option>
<option>Nubank</option>
<option>Mercado Pago</option>
<option>Cartão de crédito</option>
</select>

<!-- DESCRIÇÃO -->

<textarea
id="desc"
placeholder="Descreva sua edit..."
></textarea>

<!-- BOTÃO -->

<a
class="zap-btn"
href="#"
onclick="sendMessage()"
>
Conversar no Zap
</a>

<p class="text">
Chave Pix: 11951319587
</p>

<!-- ESTRELAS -->

<div class="rating">
<span class="star">⭐</span>
<span class="star">⭐</span>
<span class="star">⭐</span>
<span class="star">⭐</span>
<span class="star">⭐</span>
</div>

<!-- REDES -->

<div class="social">
TikTok: @dyx77cc
</div>

<div class="social">
Instagram: @dlkz.editz
</div>

</div>

</section>

<script>

function sendMessage(){

let edit =
document.getElementById("edit").value;

let pay =
document.getElementById("pay").value;

let desc =
document.getElementById("desc").value;

let message =
`Salve, vim pelo site da DLKZ77CC!

Tipo da edit:
${edit}

Forma de pagamento:
${pay}

Descrição:
${desc}`;

let url =
`https://wa.me/5511951319587?text=${encodeURIComponent(message)}`;

window.open(url,'_blank');

}

</script>

</body>
</html>
