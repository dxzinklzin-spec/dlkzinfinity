<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sukuna - Preços</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(180deg,#000,#1a0000);
  color:red;
}

.intro{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  animation:fadeIn 2s ease;
  text-align:center;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

.intro h1{
  font-size:28px;
  text-shadow:0 0 20px red;
}

.container{
  width:85%;
  margin:auto;
  padding-bottom:100px;
}

section{
  margin:70px 0;
}

.card{
  border:1px solid red;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 20px rgba(255,0,0,0.3);
}

.btn{
  display:inline-block;
  margin-top:10px;
  padding:12px 20px;
  background:red;
  color:white;
  text-decoration:none;
  border-radius:10px;
}

input, textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="intro">
  <h1>“Bem-vindo ao meu território… aqui você entra, mas não sai fácil.”</h1>
</div>

<div class="container">

<section class="card">
<h2>☠ Preços de edição</h2>
<p>• Edit simples: R$10</p>
<p>• Edit anime: R$20</p>
<p>• Edit premium: R$35+</p>
</section>

<section class="card">
<h2>📩 Descreva sua edit</h2>
<textarea placeholder="Escreva o que você quer na edit..."></textarea>
</section>

<section class="card">
<h2>💬 Finalizar pedido</h2>

<a class="btn"
href="https://wa.me/5511951319587?text=Quero%20uma%20edit%20-%20detalhes%20no%20chat"
target="_blank">
📲 Enviar para WhatsApp
</a>

</section>

<section>
<a class="btn" href="index.html">Voltar</a>
</section>

</div>

</body>
</html>
