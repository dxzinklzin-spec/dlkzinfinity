<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sukuna</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a0000, #3b0000);
      color: white;
      text-align: center;
    }

    header {
      padding: 40px;
    }

    h1 {
      font-size: 50px;
      color: #ff2b2b;
      text-shadow: 0 0 15px black;
    }

    p {
      font-size: 18px;
      max-width: 600px;
      margin: 20px auto;
      opacity: 0.9;
    }

    .card {
      background: rgba(0,0,0,0.4);
      padding: 20px;
      margin: 30px auto;
      width: 80%;
      max-width: 500px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(255,0,0,0.3);
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: red;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }

    a:hover {
      background: darkred;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sukuna</h1>
    <p>O Rei das Maldições</p>
  </header>

  <div class="card">
    <p>
      Sukuna é uma das maldições mais poderosas de *Jujutsu Kaisen*,
      conhecido como o Rei das Maldições, temido por todos os feiticeiros.
    </p>

    <a href="index.html">Voltar</a>
  </div>

</body>
</html>
